# Netlify serves the static front end (public/). The Node API runs on a separate host (see render.yaml).
# 1. Replace BACKEND below with your backend URL, for example https://edulearn-api.onrender.com
# 2. Set wsUrl in public/config.js to wss://<same host>/ws
[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://BACKEND/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/files/*"
  to = "https://BACKEND/files/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/scorm/*"
  to = "https://BACKEND/scorm/:splat"
  status = 200
  force = true
