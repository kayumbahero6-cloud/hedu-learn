# Load-balancer example. Add more "server" lines to scale out (needs shared storage, see docs/ARCHITECTURE.md).
upstream edulearn { least_conn; server app:3000; keepalive 32; }
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server { listen 80; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 60m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  location /ws { proxy_pass http://edulearn; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
  location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://edulearn; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://edulearn; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
