# Single-node setup: nginx (TLS, gzip, WebSocket) in front of the app. Run from the project root:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
services:
  app:
    build: { context: .. }
    env_file: ../.env
    volumes: [ "edulearn-data:/data" ]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro        # fullchain.pem and privkey.pem
    depends_on: [ app ]
    restart: unless-stopped
volumes:
  edulearn-data:
